<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步丝丝音乐 前台客户端</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background: linear-gradient(160deg, #ffd8ee 0%, #d0edff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 160px;
    position: relative;
}
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.8) 0%, transparent 8%),
        radial-gradient(circle at 30% 10%, rgba(180,140,255,0.6) 0%, transparent 10%),
        radial-gradient(circle at 70% 40%, rgba(100,180,255,0.5) 0%, transparent 12%),
        radial-gradient(circle at 20% 80%, rgba(255,180,220,0.4) 0%, transparent 10%);
    pointer-events:none;
    z-index:-1;
}
.main-title{
    text-align: center;
    padding: 20px 0 12px;
    font-size: 42px;
    color:#333;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
}
.top-nav{
    display:flex;
    gap:12px;
    padding:0 30px 16px;
}
.nav-btn{
    padding:8px 22px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#7b61ff,#40a9ff);
    color:#fff;
    font-size:16px;
    box-shadow:0 4px 12px rgba(100,120,255,0.35);
    cursor:pointer;
    transition:0.2s;
}
.nav-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(100,120,255,0.45);
}
.search-box{
    margin:0 30px 20px;
    display:flex;
    gap:10px;
}
#searchInput{
    flex:1;
    padding:10px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.6);
    background:rgba(255,255,255,0.35);
    font-size:16px;
    backdrop-filter:blur(6px);
}
.main-wrap{
    display:flex;
    margin:0 20px;
    gap:16px;
    height:70vh;
}
/* 左侧播放目录 1/3 */
.playlist-panel{
    width:33%;
    background:rgba(255,255,255,0.25);
    border-radius:16px;
    padding:16px;
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.4);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}
.playlist-title{
    font-size:20px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
#playlistScroll{
    flex:1;
    overflow-y:auto;
}
.play-item{
    padding:10px 12px;
    margin-bottom:8px;
    border-radius:10px;
    background:rgba(255,255,255,0.2);
    cursor:pointer;
    transition:0.2s;
}
.play-item:hover{
    background:rgba(123,97,255,0.25);
}
.play-item.active{
    background:linear-gradient(135deg,rgba(123,97,255,0.35),rgba(64,169,255,0.35));
}
/* 右侧播放器 2/3 */
.player-panel{
    width:67%;
    background:rgba(255,255,255,0.25);
    border-radius:16px;
    padding:16px;
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.4);
    display:flex;
    flex-direction:column;
}
.media-box{
    flex:1;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:center;
}
#mainVideo,#mainAudio{
    width:100%;
    height:100%;
}
.lyric-box{
    height:120px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
}
.lyric-normal{
    font-size:22px;
    color:#444;
}
.float-lyric{
    position:fixed;
    bottom:140px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 24px;
    border-radius:999px;
    cursor:move;
    user-select:none;
}
.float-lyric:hover{
    border:2px solid rgba(123,97,255,0.6);
}
.float-lyric span{
    font-size:26px;
    color:#fff;
    text-shadow:0 0 6px #000;
}
/* 底部播放控制栏 */
.bottom-control{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:120px;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(10px);
    padding:16px 30px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.progress-wrap{
    width:100%;
    height:6px;
    background:rgba(255,255,255,0.2);
    border-radius:99px;
    cursor:pointer;
}
.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7b61ff,#40a9ff);
    border-radius:99px;
}
.control-buttons{
    display:flex;
    gap:16px;
    align-items:center;
}
.ctrl-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg,#7b61ff,#40a9ff);
    color:#fff;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
}
.mini-btn-group{
    position:fixed;
    right:30px;
    bottom:130px;
    display:flex;
    gap:10px;
}
.mini-btn{
    padding:8px 14px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg,#7b61ff,#40a9ff);
    color:#fff;
    cursor:pointer;
}
/* 资源卡片网格 一行8列 */
.card-wrap{
    margin:20px 30px;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:14px;
}
.res-card{
    background:rgba(255,255,255,0.28);
    border-radius:12px;
    padding:10px;
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.4);
    cursor:pointer;
    transition:0.2s;
}
.res-card:hover{
    transform:scale(1.04);
    box-shadow:0 6px 18px rgba(123,97,255,0.3);
}
.res-card img{
    width:100%;
    aspect-ratio:1/1;
    border-radius:8px;
    object-fit:cover;
    margin-bottom:8px;
}
.res-card p{
    font-size:14px;
    color:#222;
    text-align:center;
}
</style>
</head>
<body>
<h1 class="main-title">丝丝《朝歌》</h1>
<div class="top-nav">
    <button class="nav-btn" data-type="all">全部</button>
    <button class="nav-btn" data-type="music">音乐</button>
    <button class="nav-btn" data-type="video">视频</button>
    <button class="nav-btn" data-type="pic">图片</button>
    <button class="nav-btn" data-type="reward">赞赏</button>
</div>
<div class="search-box">
    <input id="searchInput" placeholder="搜索歌曲/歌手">
</div>
<div class="main-wrap">
    <!-- 左侧播放目录 1/3 -->
    <div class="playlist-panel">
        <div class="playlist-title">
            <span>播放目录</span>
            <button class="mini-btn">收起</button>
        </div>
        <div id="playlistScroll"></div>
    </div>
    <!-- 右侧播放器 2/3 -->
    <div class="player-panel">
        <div class="media-box">
            <video id="mainVideo" controls style="display:none;"></video>
            <audio id="mainAudio" controls style="display:none;">
        </div>
        <div class="lyric-box">
            <div id="prevLyric"></div>
            <div id="currLyric"><span class="lyric-normal">暂无播放</span></div>
        </div>
    </div>
</div>
<!-- 悬浮歌词窗口 -->
<div class="float-lyric" id="floatLyric">
    <span></span>
</div>
<!-- 右下角控制按钮 -->
<div class="mini-btn-group">
    <button class="mini-btn" id="togglePlaylistBtn">播放目录</button>
    <button class="mini-btn" id="togglePlayerBtn">播放器</button>
</div>
<!-- 底部控制栏 -->
<div class="bottom-control">
    <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="control-buttons">
        <button class="ctrl-btn" id="prevBtn">◀</button>
        <button class="ctrl-btn" id="playBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">▶▶</button>
    </div>
</div>
<!-- 资源卡片容器 -->
<div class="card-wrap" id="cardWrap"></div>

<script>
// 全局接口地址 已修正
const API_BASE = "https://api.busisi.com";
const dom = {
    searchInput: document.getElementById("searchInput"),
    playlistScroll: document.getElementById("playlistScroll"),
    mainVideo: document.getElementById("mainVideo"),
    mainAudio: document.getElementById("mainAudio"),
    prevLyric: document.getElementById("prevLyric"),
    currLyric: document.getElementById("currLyric"),
    floatLyric: document.getElementById("floatLyric"),
    progressWrap: document.getElementById("progressWrap"),
    progressBar: document.getElementById("progressBar"),
    playBtn: document.getElementById("playBtn"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    cardWrap: document.getElementById("cardWrap")
}
let allResourceList = [];
let currentTabType = "all";
let nowPlayingItem = null;
let parsedLyricList = [];
let lastPlayTime = 0;

// 页面加载获取歌单
window.onload = async function(){
    await loadResourceList();
    renderFilterList();
}

// 加载资源列表 接口已修正 /api/getResourceList
async function loadResourceList(){
    try{
        const res=await fetch(`${API_BASE}/api/getResourceList`);
        const data=await res.json();
        allResourceList = data.list || [];
    }catch(err){
        dom.currLyric.innerHTML = "<span class='lyric-normal'>接口连接失败，404</span>";
        console.error(err);
    }
}

// 渲染卡片
function renderCard(list){
    dom.cardWrap.innerHTML = "";
    list.forEach(item=>{
        const div = document.createElement("div");
        div.className = "res-card";
        div.onclick = ()=>playMedia(item);
        div.innerHTML = `
            <img src="${item.coverImg}" alt="">
            <p>${item.name}</p>
        `;
        dom.cardWrap.appendChild(div);
    })
}

// 筛选渲染
function renderFilterList(){
    let src = currentTabType==="all"?allResourceList:allResourceList.filter(i=>i.type===currentTabType);
    renderCard(src);
    renderPlaylist();
}

// 渲染播放列表
function renderPlaylist(){
    dom.playlistScroll.innerHTML = "";
    allResourceList.forEach(item=>{
        const div = document.createElement("div");
        div.className = "play-item";
        if(nowPlayingItem && nowPlayingItem.id === item.id) div.classList.add("active");
        div.innerText = item.name;
        div.onclick = ()=>playMedia(item);
        div.style.userSelect:none;
        dom.playlistScroll.appendChild(div);
    })
}

// 播放媒体 歌词接口修正 /api/lrc
async function playMedia(item){
    nowPlayingItem=item;
    dom.mainVideo.pause();
    dom.mainVideo.src = "";
    dom.mainAudio.pause();
    dom.mainAudio.src = "";
    parsedLyricList = [];
    lastPlayTime = 0;
    dom.prevLyric.innerText = "";
    dom.currLyric.innerHTML = "<span class='lyric-normal'>加载中...</span>";
    if(item.type === "video"){
        dom.mainVideo.style.display = "block";
        dom.mainAudio.style.display = "none";
        dom.mainVideo.src = item.videoLink;
        dom.mainVideo.load();
        dom.mainVideo.play().catch(err=>{});
    }else if(item.type === "music"){
        dom.mainAudio.style.display = "block";
        dom.mainVideo.style.display = "none";
        dom.mainAudio.src = item.audioLink;
        dom.mainAudio.load();
        dom.mainAudio.play().catch(err=>{});
    }
    renderPlaylist();
    if(!item.lyricName){
        dom.currLyric.innerHTML = "<span class='lyric-normal'>暂无匹配歌词</span>";
        return;
    }
    try{
        const lyricRes=await fetch(`${API_BASE}/api/lrc?name=${encodeURIComponent(item.lyricName)}`);
        if(lyricRes.ok){
            const txt=await lyricRes.text();
            parsedLyricList=parseLRC(txt);
            updateFloatLyric(0);
        }else {
            dom.currLyric.innerHTML = "<span class='lyric-normal'>暂无匹配歌词</span>";
        }
    }catch(err){
        dom.currLyric.innerHTML = "<span class='lyric-normal'>歌词加载失败</span>";
    }
}

// LRC歌词解析工具
function parseLRC(lrcText){
    const lines = lrcText.split("\n");
    const list = [];
    const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
    lines.forEach(line=>{
        const match = line.match(reg);
        if(!match) return;
        const min = Number(match[1]);
        const sec = Number(match[2]);
        const ms = Number(match[3]);
        const time = min*60 + sec + ms/1000;
        const text = match[4].trim();
        list.push({time,text});
    })
    return list.sort((a,b)=>a.time-b.time);
}

// 更新悬浮歌词
function updateFloatLyric(currentTime){
    let target = parsedLyricList[0];
    for(let l of parsedLyricList){
        if(l.time <= currentTime) target = l;
    }
    dom.floatLyric.querySelector("span").innerText = target.text;
    dom.currLyric.innerHTML = `<span class="lyric-normal">${target.text}</span>`;
}

// 搜索功能
function searchResource(){
    const kw=dom.searchInput.value.trim().toLowerCase();
    if(!kw){
        renderFilterList();
        return;
    }
    let src=currentTabType==="all"?allResourceList:allResourceList.filter(i=>i.type===currentTabType);
    const res=src.filter(v=>{
        const n=(v.name||"").toLowerCase(),s=(v.singer||"").toLowerCase();
        return n.includes(kw)||s.includes(kw);
    });
    renderCard(res);
}
dom.searchInput.oninput = searchResource;

// 顶部分类切换按钮
document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.onclick = function(){
        currentTabType = this.dataset.type;
        renderFilterList();
    }
})

// 进度条拖动
dom.progressWrap.onclick = function(e){
    const rect = this.getBoundingClientRect();
    const percent = (e.clientX - rect.left)/rect.width;
    if(nowPlayingItem?.type==="music"){
        dom.mainAudio.currentTime = dom.mainAudio.duration * percent;
    }else{
        dom.mainVideo.currentTime = dom.mainVideo.duration * percent;
    }
}

// 播放进度实时更新
setInterval(()=>{
    let current = 0;
    let total = 0;
    if(dom.mainAudio.src){
        current = dom.mainAudio.currentTime;
        total = dom.mainAudio.duration;
    }else if(dom.mainVideo.src){
        current = dom.mainVideo.currentTime;
        total = dom.mainVideo.duration;
    }
    if(total){
        dom.progressBar.style.width = (current/total*100)+"%";
        if(parsedLyricList.length) updateFloatLyric(current);
    }
},200)

// 播放暂停按钮
dom.playBtn.onclick = function(){
    if(dom.mainAudio.src){
        if(dom.mainAudio.paused) dom.mainAudio.play();
        else dom.mainAudio.pause();
    }else if(dom.mainVideo.src){
        if(dom.mainVideo.paused) dom.mainVideo.play();
        else dom.mainVideo.pause();
    }
}
</script>
</body>
</html>
